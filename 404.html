const SKIP = new Set(['the', 'and', 'for', 'html', 'index', 'blog', 'posts', 'notes', 'books']);
const words = text => text.toLowerCase().split(/[^a-z0-9]+/)
    .filter(w => w.length > 2 && !/^\d+$/.test(w) && !SKIP.has(w));
const same = (a, b) => a === b ||
    (Math.min(a.length, b.length) >= 4 && (a.startsWith(b) || b.startsWith(a)));

const path = location.pathname;
document.getElementById('missing-path').textContent = path;
const query = words(path);

const matches = PAGES.map(([title, permalink, meta]) => {
  const pageWords = words(title + ' ' + permalink);
  const hits = query.filter(q => pageWords.some(w => same(q, w))).length;
  return {title, permalink, meta, score: hits / query.length, size: pageWords.length};
}).filter(m => m.score >= 0.5)
  .sort((a, b) => b.score - a.score || a.size - b.size)
  .filter((m, i, sorted) => m.score === sorted[0].score)
  .slice(0, 3);

  const suggestions = document.getElementById('suggestions');
  suggestions.innerHTML = matches.map(m => `
    <a class='related-card' href='${m.permalink}'>
      <span class='related-meta'>${m.meta}</span>
      <span class='related-title'>${m.title}</span>
    </a>`).join('');

  document.getElementById('suggest-intro').hidden = false;
}
