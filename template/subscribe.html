<section id='subscribe'>
  <form action='https://buttondown.com/api/emails/embed-subscribe/borismus'
    method='post' target='popupwindow' onsubmit="window.open('https://buttondown.com/borismus', 'popupwindow')">
    <p>Thanks for reading! If you'd like to hear when I publish something new,
      leave your email below and I'll send it your way.</p>
    <p class='signoff'>— Boris</p>
    <div class='subscribe-row'>
      <input type='email' name='email' placeholder='Your email, please' aria-label='Email address' required />
      <button type='submit'>Subscribe</button>
    </div>
  </form>
</section>
