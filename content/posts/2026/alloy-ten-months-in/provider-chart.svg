    .label { fill: #fff; font-size: 13px; font-weight: 600; }
    .note { fill: var(--muted); font-size: 12px; font-style: italic; }
    .marker { stroke: var(--axis); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .subs { fill: var(--subs); } .or { fill: var(--or); } .api { fill: var(--api); } .local { fill: var(--local); }
  </style>
