<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-label="Messages I sent per month in Alloy, by how they reached the model: direct APIs through May, OpenRouter in June, then mostly Codex and Claude subscriptions">
  <style>
    :root { --bg:#ffffff; --ink:#1f2328; --muted:#656d76; --grid:#e6e8eb; --axis:#8c959f; --subs:#2a78d6; --or:#d6457f; --api:#e8a317; --local:#1baf7a; }
    @media (prefers-color-scheme: dark) {
